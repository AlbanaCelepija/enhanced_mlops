##################################################### Artifacts
artifacts:
  data:
    - name: data_original
      config:
        filepath: "179"
    - name: data_processed
      config:
        filepath: data_processed.csv
    - name: data_training
      config:
        filepath: data_training.csv
    - name: data_testing
      config:
        filepath: data_testing.csv
    - name: data_validation
      config:
        filepath: data_validation.csv
  model:
    - name: model_baseline
      config:
        filepath: model_baseline.pickle
    - name: model_fairness_reweighing
      config:
        filepath: model_fairness_reweighing.pickle
    - name: model_fairness_disparate_impact_remover
      config:
        filepath: model_fairness_disparate_impact_remover.pickle
    - name: model_fairness_learning_fair_representations
      config:
        filepath: model_fairness_learning_fair_representations.pickle
    - name: model_fairness_fauci
      config:
        filepath: model_fairness_fauci.pickle
  configuration:
    - name: splitting_config
      config:
        valid_size: 0.2
        random_state: 4
    - name: model_train_baseline
      config:
        random_state: 4
        target_column: Status
        max_iter: 1000
    - name: model_train_fair
      config:
        target_column: Status
        sensitive: sex
    - name: model_train_fauci
      config:
        target_column: Status
        sensitive: sex
        random_state: 42
        hidden_dim: 8
        hidden_layers: 1
        epochs: 100
        batch_size: 32
        regularization_weight: 0.5
        fairness_regularization: spd
    - name: model_evaluation_fairness_metrics     # values considered fair for each metric
      config: 
        target: Status
        sensitive: sex
        positive_target: 1
        favored_class: 0
        disparate_impact:
          min_allowed: 0.8
          max_allowed: 1.2
        statistical_parity:
          min_allowed: -0.1
          max_allowed: 0.1
        equal_opportunity_difference:
          min_allowed: -0.1
          max_allowed: 0.1
    - name: model_inferenceservice_endpoint
      endpoint: "http://localhost:8080/v2/models/hiring-sklearn/versions/v0.1.0/infer"
    - name: constraints_file
      config:
        constraints_filepath: artifacts/constraints.json
        min_training_data: 1000
    - name: profiling_actions
      config:
        dataset_name: recruitment
        actions: dtypes, missing_values, unique_values, correlations, histograms, outliers, summary
  report:
    - name: data_profiling_report
      config:
        filepath: data_drift.html   
    - name: data_profiling_custom_report
      config:
        filepath: recruitment_correlation.png 
    - name: model_performance_metrics_report
      config:
        filepath: preprocessing_di_comparison.png
    - name: model_fairness_metrics_report
      config:
        filepath: model_fairness_metrics_report.csv
  status:
    - name: model_validation_baseline
      status_file: model_validation.json
      status_key: model_validation_baseline
    - name: model_validation_fairness
      status_file: model_validation.json
      status_key: model_validation_fairness
  documentation:
    - name: data_card_hiring
      filepath: cards/data_card.md
    - name: model_card_hiring
      filepath: cards/model_card.md
  function:
    - name: model_deploy_function
      function_name: model_deploy
      desc: "Deploy the model using kserve InferenceService"
      path: src/operationalization.py
  service:
    - name: model_deploy_service
      port: 1234
      namespace: kserve-test

requirements_dimensions:
  - baseline
  - fairness
  - robustness
excluded_operations:
  - system_monitoring
  - pre_inference_transformations
  - production_data_monitoring
