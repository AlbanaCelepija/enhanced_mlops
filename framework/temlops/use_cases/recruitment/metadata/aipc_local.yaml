domain: Recruitment
data_modality: tabular
ai_task: classification
ai_product_name: Hiring classifier
ai_product_description: This is a sklearn model which aims to classify whether or not an individual should be hired.
framework: local

requirements:
  - id: req_hr_high_risk_classification
    name: High-risk classification for HR CV screening
    description: >-
      Determine whether the CV-screening system falls within the high-risk
      employment category.
    source:
      framework: EU_AI_ACT
      article: "Annex III, point 4(a)"
    requirement_text: >-
      AI systems intended to be used for the recruitment or selection of
      natural persons, in particular to analyse and filter job applications
      and to evaluate candidates, are high-risk AI systems.
    summary: >-
      The HR CV-screening system is classified as high-risk because it
      analyses and filters job applications.
    kind: RISK_MANAGEMENT
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_risk_management
      - req_hr_data_governance
      - req_hr_human_oversight

  - id: req_hr_risk_management
    name: Risk management for HR CV-screening system
    description: >-
      Identify, evaluate, mitigate, and monitor risks to candidates' rights,
      opportunities, and fair access to employment.
    source:
      framework: EU_AI_ACT
      article: "Article 9"
    requirement_text: >-
      A risk management system shall be established, implemented, documented
      and maintained for high-risk AI systems, including identification,
      estimation, evaluation, mitigation, testing and monitoring of risks.
    summary: >-
      The system must maintain a lifecycle risk-management process covering
      intended use and foreseeable misuse.
    kind: RISK_MANAGEMENT
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_high_risk_classification

  - id: req_hr_data_governance
    name: Data governance for HR datasets
    description: >-
      Ensure appropriate governance of CV data, extracted features,
      historical labels, job descriptions, audit attributes, and logs.
    source:
      framework: EU_AI_ACT
      article: "Article 10"
    requirement_text: >-
      Training, validation and testing datasets shall be subject to data
      governance and management practices appropriate for the intended
      purpose of the high-risk AI system.
    summary: >-
      The framework must assess data quality, relevance, representativeness,
      bias, limitations, and data preparation practices for HR datasets.
    kind: DATA_GOVERNANCE
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_risk_management

  - id: req_diversity_eda
    name: Diversity Exploratory Analysis
    description: Data distribution and representativeness
    source:
      framework: EU_AI_ACT
      article: "Article 10(5)"
    requirement_text: >-
      Analyze the dataset for imbalances or patterns that may suggest bias,
      such as over-representation or under-representation of certain groups.
    summary: >-
      Evaluate the dataset's demographic diversity, ensuring it represents
      all relevant populations appropriately.
    kind: DATA_GOVERNANCE
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_risk_management

  - id: req_hr_technical_documentation
    name: Technical documentation for HR AI system
    description: >-
      Produce and maintain documentation describing the system, its intended
      purpose, data, model, validation, limitations, monitoring, and
      compliance evidence.
    source:
      framework: EU_AI_ACT
      article: "Article 11"
    requirement_text: >-
      Technical documentation of a high-risk AI system shall be drawn up
      before that system is placed on the market or put into service and
      shall be kept up to date.
    summary: >-
      The HR system must maintain technical documentation, including system
      cards, model cards, data cards, validation reports, and monitoring
      evidence.
    kind: DOCUMENTATION
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      # req_hr_record_keeping is cited here (and by the ComplianceContext) in
      # the source use-case document but never itself given a definition
      # there -- kept as-is rather than inventing content for it.
      - req_hr_record_keeping
      - req_hr_transparency_to_deployer

  - id: req_hr_transparency_to_deployer
    name: Transparency and instructions for HR deployers
    description: >-
      Ensure deployers and HR users receive information on intended purpose,
      limitations, performance, oversight, and correct use.
    source:
      framework: EU_AI_ACT
      article: "Article 13"
    requirement_text: >-
      High-risk AI systems shall be designed and developed in such a way as
      to ensure that their operation is sufficiently transparent to enable
      deployers to interpret the system's output and use it appropriately.
    summary: >-
      Recruiters and HR operators must receive instructions explaining how
      to use the system, how to interpret outputs, and what its limitations
      are.
    kind: TRANSPARENCY
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_human_oversight
      - req_hr_worker_candidate_information

  - id: req_hr_human_oversight
    name: Human oversight for HR screening
    description: >-
      Ensure that HR users can understand, supervise, challenge, override,
      or disregard model recommendations.
    source:
      framework: EU_AI_ACT
      article: "Article 14"
    requirement_text: >-
      High-risk AI systems shall be designed and developed in such a way
      that they can be effectively overseen by natural persons during the
      period in which they are in use.
    summary: >-
      The system must support meaningful human oversight and must not make
      final rejection decisions without appropriate human review.
    kind: HUMAN_OVERSIGHT
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_transparency_to_deployer

  - id: req_hr_worker_candidate_information
    name: Information to affected persons in HR context
    description: >-
      Inform workers, representatives, or candidates where required that a
      high-risk AI system is used in the recruitment process.
    source:
      framework: EU_AI_ACT
      article: "Article 26"
    requirement_text: >-
      Before putting into service or using a high-risk AI system at the
      workplace, deployers who are employers shall inform workers'
      representatives and affected workers that they will be subject to the
      use of the high-risk AI system; deployers of high-risk AI systems
      listed in Annex III that make or facilitate decisions concerning
      natural persons shall inform those persons that they are subject to
      its use.
    summary: >-
      Candidates and, where relevant, workers or worker representatives must
      be informed that the HR process uses a high-risk AI system.
    kind: TRANSPARENCY
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_transparency_to_deployer

  - id: req_hr_accuracy_robustness
    name: Accuracy and robustness for HR screening
    description: >-
      Validate predictive performance, robustness to CV variation and
      deployment drift.
    source:
      framework: EU_AI_ACT
      article: "Article 15"
    requirement_text: >-
      High-risk AI systems shall be designed and developed in such a way
      that they achieve an appropriate level of accuracy and robustness, and
      perform consistently throughout their lifecycle.
    summary: >-
      The HR model must be tested for accuracy, robustness, calibration, and
      degradation under shift.
    kind: TESTING
    context: cc_hr_cv_screening
    applicability_status: APPLICABLE
    related_requirements:
      - req_hr_risk_management


compliance_objectives:
  - id: objective_data_quality_check
    name: Data quality check
    description: >-
      A data-quality profiling report must be produced for the training
      data, flagging missing values, duplicates, and distributional issues
      before the data is used for model training.
    metric: metric_data_quality_pass_rate
    condition:
      kind: threshold
      operator: GEQ
      value: 0.95
    priority: MANDATORY
    severity: HIGH
    scope:
      applies_to: [data_training]
    requirements:
      - req_hr_data_governance


operations:


