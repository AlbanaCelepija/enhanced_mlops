  - type: data_preprocessing  
    stage: data_preparation
    id: split_train_valid_test_data
    name: Split data into train, validation and test sets 
    requirement_dimension: baseline
    implementation: 
      framework: local
      spec:
        path: src/local_platform/data_preparation.py
        method_name: split_train_valid_test_data
